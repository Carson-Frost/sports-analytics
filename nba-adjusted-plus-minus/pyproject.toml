[project]
name = "nbapm"
version = "1.0.0"
description = "Regularized adjusted plus-minus for NBA players, from stats.nba.com play-by-play"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
