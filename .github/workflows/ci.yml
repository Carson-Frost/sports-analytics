name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - nba-foul-up-3
          - nfl-fourth-down-model
          - nfl-personnel-efficiency
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  check:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Every test job passed
        run: test "${{ needs.test.result }}" = success
      - uses: actions/checkout@v4
      - name: No em dashes in docs
        run: "! git grep -n '—' -- '*.md'"
      - name: No ADR or ticket references in docs
        run: "! git grep -nEi '\badrs?\b|docs/adr|(^|[ (])#[0-9]+\b' -- '*.md'"
      - name: No broken relative links in docs
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress './**/*.md'
